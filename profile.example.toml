# Your resume material. Copy this file to profile.toml and replace everything with your own
# experience. profile.toml is ignored by git. Everything below is a made-up example person.
#
# How tailoring uses this file:
# - Each bullet lists keywords. A bullet scores one point per keyword found in the job description.
# - Entries with core = true always appear (keep at least min_bullets of their bullets).
# - Other entries and extra bullets are added best-first while the resume still fits the page limit.
# Only write things you actually did: the program picks and orders bullets, it never invents them.

